<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Paid Orders</title>
    <style>
        :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; color:#111}
        body{margin:20px;background:#f6f8fa}
        .card{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 4px rgba(17,24,39,.06)}
        header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
        h1{font-size:18px;margin:0}
        .controls{display:flex;gap:8px;align-items:center}
        input[type="search"]{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px}
        button{padding:8px 10px;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
        table{width:100%;border-collapse:collapse;margin-top:12px}
        th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef2f7}
        th{font-size:13px;color:#374151}
        td{font-size:14px;color:#111}
        .muted{color:#6b7280;font-size:13px}
        .empty{padding:28px;text-align:center;color:#6b7280}
        .badge{background:#10b981;color:#fff;padding:4px 8px;border-radius:999px;font-size:12px}
        .actions a{margin-right:8px;color:#2563eb;text-decoration:none}
        .loading{padding:18px;text-align:center;color:#374151}
        @media (max-width:700px){
            table thead{display:none}
            table,tr,td{display:block;width:100%}
            tr{margin-bottom:10px;border-bottom:1px solid #eee}
            td{padding:8px 0}
            td::before{content:attr(data-label);display:block;font-weight:600;color:#374151;margin-bottom:4px}
        }
    </style>
</head>
<body>
    <main class="card" id="app">
        <header>
            <h1>Paid Orders</h1>
            <div class="controls">
                <input id="q" type="search" placeholder="Search by order id, customer..." aria-label="Search paid orders" />
                <button id="refresh">Refresh</button>
            </div>
        </header>

        <div id="status" class="loading">Loading paid orders…</div>

        <div id="tableWrapper" style="display:none">
            <table aria-live="polite">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders"></tbody>
            </table>
        </div>

        <div id="empty" class="empty" style="display:none">
            No paid orders found.
        </div>
    </main>

    <script>
        (function(){
            const endpoint = (function(){
                // Default endpoint; change if your API differs.
                // Examples: '/api/orders?status=paid' or '/orders/paid'
                return '/api/orders?status=paid';
            })();

            const elStatus = document.getElementById('status');
            const elOrders = document.getElementById('orders');
            const elTableWrapper = document.getElementById('tableWrapper');
            const elEmpty = document.getElementById('empty');
            const qInput = document.getElementById('q');
            const refreshBtn = document.getElementById('refresh');

            let allOrders = [];

            function fmtCurrency(amount, currency){
                try {
                    return new Intl.NumberFormat(undefined, { style: 'currency', currency: currency || 'USD' }).format(amount);
                } catch(e){
                    return (currency ? currency + ' ' : '') + Number(amount).toFixed(2);
                }
            }

            function fmtDate(iso){
                if(!iso) return '';
                const d = new Date(iso);
                if (isNaN(d)) return iso;
                return d.toLocaleString();
            }

            function renderList(list){
                elOrders.innerHTML = '';
                if(!list.length){
                    elTableWrapper.style.display = 'none';
                    elEmpty.style.display = '';
                    elStatus.style.display = 'none';
                    return;
                }
                elEmpty.style.display = 'none';
                elTableWrapper.style.display = '';
                elStatus.style.display = 'none';

                const frag = document.createDocumentFragment();
                list.forEach(o=>{
                    const tr = document.createElement('tr');

                    const tdId = document.createElement('td'); tdId.textContent = o.id || o.orderId || o._id || ''; tdId.setAttribute('data-label','Order ID');
                    const tdCustomer = document.createElement('td'); tdCustomer.textContent = o.customer?.name || o.customerName || o.customer || '—'; tdCustomer.setAttribute('data-label','Customer');
                    const tdTotal = document.createElement('td'); tdTotal.textContent = fmtCurrency(o.total ?? o.amount ?? 0, o.currency || 'USD'); tdTotal.setAttribute('data-label','Total');
                    const tdDate = document.createElement('td'); tdDate.textContent = fmtDate(o.paidAt || o.date || o.createdAt); tdDate.setAttribute('data-label','Date');
                    const tdStatus = document.createElement('td'); tdStatus.innerHTML = '<span class="badge">Paid</span>'; tdStatus.setAttribute('data-label','Status');
                    const tdActions = document.createElement('td'); tdActions.className = 'actions'; tdActions.setAttribute('data-label','Actions');

                    // View link
                    const viewLink = document.createElement('a');
                    viewLink.href = o.viewUrl || ('/orders/' + (o.id || o.orderId || o._id));
                    viewLink.textContent = 'View';
                    viewLink.setAttribute('aria-label','View order ' + (o.id || o.orderId || ''));
                    tdActions.appendChild(viewLink);

                    // Receipt/download if available
                    if(o.receiptUrl){
                        const r = document.createElement('a');
                        r.href = o.receiptUrl;
                        r.textContent = 'Receipt';
                        r.target = '_blank';
                        tdActions.appendChild(r);
                    }

                    tr.appendChild(tdId);
                    tr.appendChild(tdCustomer);
                    tr.appendChild(tdTotal);
                    tr.appendChild(tdDate);
                    tr.appendChild(tdStatus);
                    tr.appendChild(tdActions);

                    frag.appendChild(tr);
                });
                elOrders.appendChild(frag);
            }

            function showError(msg){
                elStatus.style.display = '';
                elStatus.textContent = 'Error: ' + msg;
                elTableWrapper.style.display = 'none';
                elEmpty.style.display = 'none';
            }

            async function load(){
                elStatus.style.display = '';
                elStatus.textContent = 'Loading paid orders…';
                elTableWrapper.style.display = 'none';
                elEmpty.style.display = 'none';
                try {
                    const res = await fetch(endpoint, { credentials: 'include' });
                    if(!res.ok) {
                        const text = await res.text().catch(()=>res.statusText);
                        throw new Error(res.status + ' ' + text);
                    }
                    const data = await res.json();
                    // expecting an array; if API wraps results adjust accordingly:
                    allOrders = Array.isArray(data) ? data : (data.orders || data.data || []);
                    renderList(allOrders);
                } catch(err){
                    showError(err.message || 'Failed to fetch paid orders');
                }
            }

            function applyFilter(){
                const q = (qInput.value || '').trim().toLowerCase();
                if(!q){
                    renderList(allOrders);
                    return;
                }
                const filtered = allOrders.filter(o=>{
                    const id = String(o.id || o.orderId || o._id || '').toLowerCase();
                    const cust = (o.customer?.name || o.customerName || o.customer || '').toString().toLowerCase();
                    const email = (o.customer?.email || '').toString().toLowerCase();
                    const total = String(o.total ?? o.amount ?? '').toLowerCase();
                    return id.includes(q) || cust.includes(q) || email.includes(q) || total.includes(q);
                });
                renderList(filtered);
            }

            qInput.addEventListener('input', () => applyFilter());
            refreshBtn.addEventListener('click', () => load());

            // initial load
            document.addEventListener('DOMContentLoaded', load);
        })();
    </script>
</body>
</html>
