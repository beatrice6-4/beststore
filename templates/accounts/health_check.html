{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4><i class="fas fa-heartbeat"></i> System Health Check</h4>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <tr>
                    <td><strong>Database Status:</strong></td>
                    <td>{{ health_data.database }}</td>
                </tr>
                <tr>
                    <td><strong>Debug Mode:</strong></td>
                    <td>{{ health_data.debug_mode }}</td>
                </tr>
                <tr>
                    <td><strong>Installed Apps:</strong></td>
                    <td>{{ health_data.installed_apps }}</td>
                </tr>
                <tr>
                    <td><strong>Middleware Active:</strong></td>
                    <td>{{ health_data.middleware }}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
{% endblock %}
