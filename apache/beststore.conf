# Apache VirtualHost Configuration for BestStore Django Application
# Place this file in /etc/apache2/sites-available/ on Linux
# or in Apache conf.d/ directory on other systems

<VirtualHost *:80>
    ServerName mamamaasaibakers.com
    ServerAlias www.mamamaasaibakers.com
    ServerAdmin admin@mamamaasaibakers.com
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName mamamaasaibakers.com
    ServerAlias www.mamamaasaibakers.com
    ServerAdmin admin@mamamaasaibakers.com
    
    # SSL Certificate Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mamamaasaibakers.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mamamaasaibakers.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/mamamaasaibakers.com/chain.pem
    
    # SSL/TLS Hardening
    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    
    # Project Directory
    DocumentRoot /var/www/mamamaasaibakers
    
    # WSGI Configuration for Django
    WSGIDaemonProcess beststore python-home=/var/www/mamamaasaibakers/venv python-path=/var/www/mamamaasaibakers processes=4 threads=15 maximum-requests=10000 display-name=%{GROUP}
    WSGIProcessGroup beststore
    WSGIScriptAlias / /var/www/mamamaasaibakers/beststore/wsgi.py
    
    # Static Files - Served directly by Apache without going through Django
    Alias /static/ /var/www/mamamaasaibakers/staticfiles/
    <Directory /var/www/mamamaasaibakers/staticfiles>
        Require all granted
        Options -Indexes
        AddType text/css .css
        AddType text/javascript .js
        <FilesMatch "\.(css|js|woff|woff2|ttf|svg|eot|otf)$">
            Header set Cache-Control "public, max-age=31536000"
        </FilesMatch>
    </Directory>
    
    # Media Files - User Uploaded Content
    Alias /media/ /var/www/mamamaasaibakers/mediafiles/
    <Directory /var/www/mamamaasaibakers/mediafiles>
        Require all granted
        <FilesMatch "\.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
    </Directory>
    
    # WSGI Application Directory
    <Directory /var/www/mamamaasaibakers/beststore>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    
    # Project Root Directory
    <Directory /var/www/mamamaasaibakers>
        Require all granted
        Options -Indexes
    </Directory>
    
    # Deny direct access to Python files
    <FilesMatch "\.py$">
        Require all denied
    </FilesMatch>
    
    # Deny access to sensitive files
    <FilesMatch "(\.git|\.env|\.gitignore|\.htaccess|manage\.py)">
        Require all denied
    </FilesMatch>
    
    # Gzip Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/beststore_error.log
    CustomLog ${APACHE_LOG_DIR}/beststore_access.log combined
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
</VirtualHost>
